<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center" style="height: 100vh;">
    <div class="card p-4 mx-auto shadow-lg" style="width: 350px;">
        <h4 class="text-center mb-4">Acesso Restrito</h4>
        <div class="mb-3">
            <input type="email" id="email" class="form-control" placeholder="E-mail do Administrador">
        </div>
        <div class="mb-3">
            <input type="password" id="senha" class="form-control" placeholder="Senha">
        </div>
        <button onclick="entrar()" class="btn btn-primary w-100">Entrar</button>
        <p class="text-muted small mt-3 text-center">Apenas pessoal autorizado.</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <script>
        // Sua configuração do Firebase (Corrigida)
        const firebaseConfig = {
            apiKey: "AIzaSyBrjM1C840QnWGQIrInvCAjnNBQuSVqy78",
            authDomain: "financeiroescola-587af.firebaseapp.com",
            projectId: "financeiroescola-587af",
            storageBucket: "financeiroescola-587af.firebasestorage.app",
            messagingSenderId: "55720778459",
            appId: "1:55720778459:web:0bdd1d9acdd2d4bf398afe"
        };

        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);

        function entrar() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            
            // Validação simples para não enviar campos vazios
            if (!email || !senha) {
                alert("Por favor, preencha e-mail e senha.");
                return;
            }

            firebase.auth().signInWithEmailAndPassword(email, senha)
                .then(() => { 
                    window.location.href = "admin.html"; 
                })
                .catch(err => {
                    alert("Erro ao entrar: " + err.message);
                });
        }
    </script>
</body>
</html>
