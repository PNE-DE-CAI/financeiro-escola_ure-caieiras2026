<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin - Cadastro de Alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .cartao-fisico { width: 350px; background: #2c3e50; color: white; border-radius: 12px; padding: 20px; display: none; margin-top: 20px; border: 2px solid #000; }
        .qr-white { background: white; padding: 5px; float: right; border-radius: 5px; }
    </style>
</head>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Escola Financeiro</a>
      <div class="navbar-nav">
        <a class="nav-link" href="admin.html">Cadastrar Aluno</a>
        <a class="nav-link" href="caixa.html">Caixa/Vendas</a>
        <button class="btn btn-outline-light btn-sm ms-3" onclick="logout()">Sair</button>
      </div>
    </div>
  </nav>
  
  <script>
    function logout() {
      firebase.auth().signOut().then(() => {
        window.location.href = "index.html";
      });
    }
  </script>
<body class="container py-4">
    <nav class="mb-4">
        <a href="admin.html" class="btn btn-sm btn-dark">Admin</a>
        <a href="caixa.html" class="btn btn-sm btn-outline-dark">Caixa</a>
    </nav>

    <h2>Cadastrar Aluno</h2>
    <div class="card p-4 shadow-sm">
        <input type="text" id="idA" class="form-control mb-2" placeholder="Matrícula (Ex: 1001)">
        <input type="text" id="nomeA" class="form-control mb-2" placeholder="Nome Completo">
        <input type="number" id="saldoA" class="form-control mb-2" placeholder="Saldo Inicial R$">
        <button onclick="salvarAluno()" class="btn btn-success w-100">Salvar e Gerar QR</button>
    </div>

    <div id="cartaoVisual" class="cartao-fisico mx-auto">
        <h5>ESCOLA MODELO</h5>
        <div id="qrcode" class="qr-white"></div>
        <p class="mt-2"><strong>Aluno:</strong> <span id="resNome"></span></p>
        <p><strong>ID:</strong> <span id="resId"></span></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBrjM1C840QnWGQIrInvCAjnNBQuSVqy78",
  authDomain: "financeiroescola-587af.firebaseapp.com",
  projectId: "financeiroescola-587af",
  storageBucket: "financeiroescola-587af.firebasestorage.app",
  messagingSenderId: "55720778459",
  appId: "1:55720778459:web:0bdd1d9acdd2d4bf398afe"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Proteção: Volta pro login se não estiver logado
        firebase.auth().onAuthStateChanged(user => { if (!user) window.location.href = "index.html"; });

        function salvarAluno() {
            const id = document.getElementById('idA').value;
            const nome = document.getElementById('nomeA').value;
            const saldo = parseFloat(document.getElementById('saldoA').value);

            db.collection("alunos").doc(id).set({ nome, saldo }).then(() => {
                document.getElementById('resNome').innerText = nome;
                document.getElementById('resId').innerText = id;
                document.getElementById('cartaoVisual').style.display = "block";
                
                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById("qrcode"), {
                    // AJUSTE O LINK ABAIXO COM SEU USUARIO DO GITHUB
                    text: `https://seu-usuario.github.io/financeiro-escola/consulta.html?id=${id}`,
                    width: 80, height: 80
                });
            });
        }
    </script>
</body>
</html>
